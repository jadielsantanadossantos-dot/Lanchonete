<!DOCTYPE html>
<html lang="pt-BR" data-theme="garcom">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Garçom - Lanchonete</title>
  <link rel="stylesheet" href="/css/auth.css?v=20260825a">
</head>
<body>
  <div class="auth-loader" id="auth-loader">
    <div class="auth-loader-spin"></div>
  </div>

  <div class="auth-container auth-garcom-theme">
    <div class="auth-header">
      <div class="auth-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <h1 class="auth-title">Painel do Garçom</h1>
      <p class="auth-subtitle">Digite suas credenciais para acessar</p>
    </div>

    <div class="auth-error" id="auth-error"></div>

    <form id="login-form" class="auth-form">
      <div class="auth-form-group">
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" name="usuario" placeholder="seu usuário" required autocomplete="username">
      </div>

      <div class="auth-form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="auth-btn" id="login-btn">Entrar</button>
    </form>

    <a href="/login-admin" class="auth-link">&larr; Acessar painel Admin</a>
  </div>

  <script src="/js/auth.js?v=20260825a"></script>
  <script src="/js/login.js?v=20260825a"></script>
  <script>
    window.LOGIN_PERFIL = 'garcom';
    document.getElementById('auth-loader').style.display = 'none';
  </script>
</body>
</html>
