<!DOCTYPE html>
<html lang="pt-BR" data-theme="garcom">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Garçom - Lanchonete</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://*.cloudflareinsights.com https://cloudflareinsights.com; script-src-elem 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://*.cloudflareinsights.com https://cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;">
  <link rel="stylesheet" href="/css/auth.css?v=20261017d">
</head>
<body>
  <div class="auth-loader" id="auth-loader">
    <div class="auth-loader-spin"></div>
  </div>

  <div class="auth-container auth-garcom-theme">
    <div class="auth-header">
      <div class="auth-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <h1 class="auth-title">Painel do Garçom</h1>
      <p class="auth-subtitle">Digite suas credenciais para acessar</p>
    </div>

    <div class="auth-error" id="auth-error"></div>

    <form id="login-form" class="auth-form" autocomplete="off">
      <div class="auth-form-group">
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" name="usuario_garcom" placeholder="seu usuário" required autocomplete="section-garcom username">
      </div>

      <div class="auth-form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha_garcom" placeholder="••••••••" required autocomplete="section-garcom current-password">
      </div>

      <button type="submit" class="auth-btn" id="login-btn">Entrar</button>
    </form>

    <a href="/login-admin" class="auth-link">&larr; Acessar painel Admin</a>
  </div>

  <script src="/js/auth.js?v=20260826a"></script>
  <script src="/js/login.js?v=20260826a"></script>
  <script>
    window.LOGIN_PERFIL = 'garcom';
    document.getElementById('auth-loader').style.display = 'none';
  </script>
</body>
</html>
