<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Lanchonete</title>
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth-container auth-admin-theme">
    <div class="auth-header">
      <div class="auth-icon">&#128273;</div>
      <h1 class="auth-title">Painel Admin</h1>
      <p class="auth-subtitle">Digite suas credenciais para acessar</p>
    </div>

    <div class="auth-error" id="auth-error"></div>

    <form id="login-form" class="auth-form">
      <div class="auth-form-group">
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" name="usuario" placeholder="admin" required autocomplete="username">
      </div>

      <div class="auth-form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="auth-btn" id="login-btn">Entrar</button>
    </form>

    <a href="/login-garcom" class="auth-link">Acessar painel do Garçom &rarr;</a>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/login.js"></script>
  <script>
    window.LOGIN_PERFIL = 'admin';
  </script>
</body>
</html>
