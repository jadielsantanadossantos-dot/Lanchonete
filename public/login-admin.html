<!DOCTYPE html>
<html lang="pt-BR" data-theme="admin">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Lanchonete</title>
  <link rel="stylesheet" href="/css/auth.css?v=20261017d">
</head>
<body>
  <div class="auth-loader" id="auth-loader">
    <div class="auth-loader-spin"></div>
  </div>

  <div class="auth-container auth-admin-theme">
    <div class="auth-header">
      <div class="auth-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h1 class="auth-title">Painel Admin</h1>
      <p class="auth-subtitle">Digite suas credenciais para acessar</p>
    </div>

    <div class="auth-error" id="auth-error"></div>

    <form id="login-form" class="auth-form" autocomplete="off">
      <div class="auth-form-group">
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" name="usuario_admin" placeholder="admin" required autocomplete="section-admin username">
      </div>

      <div class="auth-form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha_admin" placeholder="••••••••" required autocomplete="section-admin current-password">
      </div>

      <button type="submit" class="auth-btn" id="login-btn">Entrar</button>
    </form>

    <a href="/login-garcom" class="auth-link">Acessar painel do Garçom &rarr;</a>
  </div>

  <script src="/js/auth.js?v=20260826a"></script>
  <script src="/js/login.js?v=20260826a"></script>
  <script>
    window.LOGIN_PERFIL = 'admin';
    document.getElementById('auth-loader').style.display = 'none';
  </script>
</body>
</html>
